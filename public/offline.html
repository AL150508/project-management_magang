<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Offline - Manajemen Magang</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(to bottom, #eff6ff, #ecfeff, #ffffff);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    
    .icon-wrapper {
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }
    
    .offline-icon svg {
      width: 60px;
      height: 60px;
      color: white;
    }
    
    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    p {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .button {
      display: inline-block;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border: none;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }
    
    .button:active {
      transform: translateY(0);
    }
    
    .decorative-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
    }
    
    .blob-1 {
      width: 300px;
      height: 300px;
      background: #bfdbfe;
      top: -100px;
      left: -100px;
    }
    
    .blob-2 {
      width: 250px;
      height: 250px;
      background: #a5f3fc;
      top: -80px;
      right: -80px;
    }
    
    .blob-3 {
      width: 350px;
      height: 350px;
      background: #93c5fd;
      bottom: -150px;
      right: -150px;
    }
    
    .blob-4 {
      width: 200px;
      height: 200px;
      background: #bae6fd;
      bottom: -50px;
      left: -50px;
    }
    
    @media (max-width: 640px) {
      h1 {
        font-size: 1.5rem;
      }
      
      p {
        font-size: 0.9375rem;
      }
      
      .offline-icon {
        width: 100px;
        height: 100px;
      }
      
      .offline-icon svg {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="decorative-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  
  <div class="container">
    <div class="icon-wrapper">
      <div class="offline-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
        </svg>
      </div>
    </div>
    
    <h1>Kamu Sedang Offline</h1>
    <p>Periksa koneksi internetmu dan coba lagi nanti.</p>
    
    <button class="button" id="retryButton" onclick="handleRetry()">
      Coba Lagi
    </button>
  </div>
  
  <script>
    // Fungsi untuk clear semua cache
    async function clearAllCaches() {
      try {
        // Unregister service worker
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
            console.log('✅ Service worker unregistered');
          }
        }
        
        // Clear semua cache
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          console.log('✅ All caches cleared');
        }
      } catch (error) {
        console.warn('⚠️ Error clearing caches:', error);
      }
    }
    
    // Cek status online saat halaman dimuat - jika online, langsung redirect
    (async function checkOnlineOnLoad() {
      // Tunggu sebentar untuk memastikan halaman sudah fully loaded
      await new Promise(resolve => setTimeout(resolve, 500));
      
      // Cek navigator.onLine terlebih dahulu (cepat)
      if (navigator.onLine) {
        try {
          // Verifikasi dengan fetch ke endpoint yang pasti ada
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3000); // 3 detik timeout
          
          const response = await fetch(window.location.origin + '/', { 
            method: 'HEAD',
            cache: 'no-store',
            signal: controller.signal,
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
              'Expires': '0'
            }
          });
          
          clearTimeout(timeoutId);
          
          if (response.ok) {
            console.log('✅ Online terdeteksi saat load, redirect ke halaman utama...');
            // Clear semua cache dan redirect
            await clearAllCaches();
            window.location.replace('/?t=' + Date.now());
            return;
          }
        } catch (error) {
          // Masih offline, lanjutkan tampilkan offline page
          console.log('❌ Masih offline saat load:', error.name, error.message);
        }
      }
      
      console.log('📱 Menampilkan halaman offline');
    })();
    
    // Fungsi untuk handle retry dengan bypass cache
    async function handleRetry() {
      const button = document.getElementById('retryButton');
      const originalText = button.textContent;
      
      // Disable button dan tampilkan loading
      button.disabled = true;
      button.textContent = 'Memeriksa koneksi...';
      
      try {
        // Cek apakah benar-benar online dengan fetch ke server
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 detik timeout
        
        const response = await fetch(window.location.origin + '/', { 
          method: 'HEAD',
          cache: 'no-store',
          signal: controller.signal,
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });
        
        clearTimeout(timeoutId);
        
        if (response.ok) {
          // User benar-benar online, clear cache dan redirect
          console.log('✅ Koneksi online terdeteksi, redirect ke halaman utama...');
          button.textContent = 'Mengarahkan...';
          
          // Clear semua cache
          await clearAllCaches();
          
          // Redirect ke halaman utama
          window.location.replace('/?t=' + Date.now());
        } else {
          throw new Error(`Network response: ${response.status}`);
        }
      } catch (error) {
        // Masih offline atau error
        console.log('❌ Masih offline atau error:', error.name, error.message);
        button.textContent = originalText;
        button.disabled = false;
        
        // Hapus pesan error sebelumnya jika ada
        const existingMessage = button.parentNode.querySelector('.error-message');
        if (existingMessage) {
          existingMessage.remove();
        }
        
        // Tampilkan pesan error
        const message = document.createElement('p');
        message.className = 'error-message';
        message.textContent = 'Masih tidak dapat terhubung. Pastikan koneksi internet Anda aktif.';
        message.style.color = '#ef4444';
        message.style.marginTop = '1rem';
        message.style.fontSize = '0.875rem';
        button.parentNode.appendChild(message);
        
        // Hapus pesan setelah 5 detik
        setTimeout(() => {
          if (message.parentNode) {
            message.parentNode.removeChild(message);
          }
        }, 5000);
      }
    }
    
    // Cek koneksi internet secara berkala dan auto-reload jika online
    window.addEventListener('online', async function() {
      console.log('🌐 Event online terdeteksi, memeriksa koneksi...');
      
      // Tunggu sebentar sebelum cek (kadang event online tidak akurat)
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      try {
        // Verifikasi dengan fetch dengan timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        
        const response = await fetch(window.location.origin + '/', { 
          method: 'HEAD',
          cache: 'no-store',
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.ok) {
          console.log('✅ Koneksi online dikonfirmasi, reload halaman...');
          // Clear cache dan redirect
          await clearAllCaches();
          window.location.replace('/?t=' + Date.now());
        }
      } catch (error) {
        console.log('❌ Masih offline:', error.name, error.message);
      }
    });
    
    // Auto-retry setiap 15 detik jika masih offline (lebih hemat resource)
    let retryCount = 0;
    const maxRetries = 8; // 2 menit total (8 x 15 detik)
    
    const checkConnection = setInterval(async function() {
      retryCount++;
      
      // Stop auto-retry setelah max attempts
      if (retryCount >= maxRetries) {
        clearInterval(checkConnection);
        console.log('⏸️ Auto-retry dihentikan setelah', maxRetries, 'percobaan');
        return;
      }
      
      // Hanya cek jika navigator mengatakan online
      if (!navigator.onLine) {
        console.log('📱 Navigator.onLine: false, skip check');
        return;
      }
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        
        const response = await fetch(window.location.origin + '/', { 
          method: 'HEAD',
          cache: 'no-store',
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.ok) {
          console.log('✅ Koneksi online terdeteksi, auto-reload...');
          clearInterval(checkConnection);
          
          // Clear cache dan redirect
          await clearAllCaches();
          window.location.replace('/?t=' + Date.now());
        }
      } catch (error) {
        // Masih offline
        console.log(`❌ Auto-retry ${retryCount}/${maxRetries}: ${error.name}`);
      }
    }, 15000); // Check setiap 15 detik
  </script>
</body>
</html>
