<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Push Notification - Magang Portal</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2563eb;
      margin-top: 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .status {
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      font-size: 14px;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }
    .warning {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde047;
    }
    code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔔 Test Push Notification</h1>
    <p>Gunakan halaman ini untuk test push notification dengan benar.</p>
    
    <div id="status"></div>
    
    <h3>Step 1: Check Permission</h3>
    <button onclick="checkPermission()">Check Permission Status</button>
    
    <h3>Step 2: Request Permission</h3>
    <button onclick="requestPermission()">Request Permission</button>
    
    <h3>Step 3: Test Local Notification</h3>
    <button onclick="testLocalNotification()">Show Test Notification</button>
    
    <h3>Step 4: Register Service Worker</h3>
    <button onclick="registerSW()">Register Service Worker</button>
    
    <h3>Step 5: Test Push Event</h3>
    <button onclick="testPushEvent()">Simulate Push Event</button>
  </div>

  <script>
    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
    }

    function checkPermission() {
      const permission = Notification.permission;
      let message = `Current permission: <code>${permission}</code><br>`;
      
      if (permission === 'granted') {
        message += '✅ Permission granted! You can receive notifications.';
        showStatus(message, 'success');
      } else if (permission === 'denied') {
        message += '❌ Permission denied! Please enable notifications in browser settings:<br>';
        message += '1. Click the lock icon in address bar<br>';
        message += '2. Find "Notifications" setting<br>';
        message += '3. Change to "Allow"<br>';
        message += '4. Reload this page';
        showStatus(message, 'error');
      } else {
        message += '⚠️ Permission not requested yet. Click "Request Permission" button.';
        showStatus(message, 'warning');
      }
    }

    async function requestPermission() {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          showStatus('✅ Permission granted successfully!', 'success');
        } else {
          showStatus('❌ Permission denied. Please allow notifications.', 'error');
        }
      } catch (error) {
        showStatus(`❌ Error requesting permission: ${error.message}`, 'error');
      }
    }

    function testLocalNotification() {
      if (Notification.permission !== 'granted') {
        showStatus('❌ Permission not granted. Please request permission first.', 'error');
        return;
      }

      try {
        new Notification('Test Notification', {
          body: 'This is a test notification from Magang Portal',
          icon: '/icons/icon-192x192.png',
          badge: '/icons/icon-192x192.png'
        });
        showStatus('✅ Test notification sent! Check your notification tray.', 'success');
      } catch (error) {
        showStatus(`❌ Error showing notification: ${error.message}`, 'error');
      }
    }

    async function registerSW() {
      if (!('serviceWorker' in navigator)) {
        showStatus('❌ Service Workers not supported in this browser.', 'error');
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;
        showStatus(`✅ Service Worker registered successfully!<br>Scope: <code>${registration.scope}</code>`, 'success');
      } catch (error) {
        showStatus(`❌ Service Worker registration failed: ${error.message}`, 'error');
      }
    }

    async function testPushEvent() {
      if (Notification.permission !== 'granted') {
        showStatus('❌ Permission not granted. Please request permission first.', 'error');
        return;
      }

      try {
        const registration = await navigator.serviceWorker.ready;
        
        // Show notification via service worker
        await registration.showNotification('Push Test', {
          body: 'This is a test push notification via Service Worker',
          icon: '/icons/icon-192x192.png',
          badge: '/icons/icon-192x192.png',
          tag: 'test-push',
          vibrate: [200, 100, 200]
        });
        
        showStatus('✅ Push notification sent via Service Worker!', 'success');
      } catch (error) {
        showStatus(`❌ Error: ${error.message}`, 'error');
      }
    }

    // Auto-check permission on load
    window.addEventListener('load', checkPermission);
  </script>
</body>
</html>
